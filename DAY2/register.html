<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthNest | Register</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">
        <img src="image.png" alt="HealthNest Logo">
      </a>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a class="active" href="register.html">Register</a>
        <a href="login.html" class="btn btn-primary">Login</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container form-wrap">
      <div class="form-card">
        <h2>Create Account</h2>
        <p>Register as a patient or user to access the hospital system.</p>
        <form id="registerForm" action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required>
            </div>
            <div class="form-group">
              <label for="role">Role</label>
              <select id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="patient">Patient</option>
                <option value="staff">Staff</option>
                <option value="doctor">Doctor</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="new-password">Password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" required>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Register</button>
            <a href="login.html" class="btn btn-outline">Already have an account?</a>
          </div>

          <p class="form-note small-text">By creating an account, you agree to our <a href="terms.html">Terms and Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</p>
          <p id="registerMsg" class="small-text"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
