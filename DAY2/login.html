<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthNest | Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">
        <img src="image.png" alt="HealthNest Logo">
      </a>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="register.html" class="btn btn-outline">Register</a>
        <a class="active" href="login.html" class="btn btn-primary">Login</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container form-wrap">
      <div class="form-card">
        <h2>Login to Your Account</h2>
        <p>Access your dashboard securely.</p>
        <form id="loginForm" action="#" method="post">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <div class="inline-links">
              <label for="current-password">Password</label>
              <a href="forgot-password.html">Forgot password?</a>
            </div>
            <input id="current-password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="register.html" class="btn btn-outline">Create Account</a>
          </div>

          <p id="loginMsg" class="small-text"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
