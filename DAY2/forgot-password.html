<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareLink | Forgot Password</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a href="index.html" class="logo"
          ><span class="logo-icon">+</span><span>Care<span>Link</span></span></a
        >
        <nav class="nav-menu">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact</a>
          <a href="faq.html">FAQ</a>
          <a href="register.html" class="btn btn-outline">Register</a>
          <a href="login.html" class="btn btn-primary">Login</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container form-wrap">
        <div class="form-card">
          <h2>Reset Password</h2>
          <p>Enter your email and we will send password reset instructions.</p>
          <form action="#" method="post">
            <div class="form-group">
              <label for="resetEmail">Email</label>
              <input
                id="resetEmail"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Send Reset Link
              </button>
              <a href="login.html" class="btn btn-outline">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
