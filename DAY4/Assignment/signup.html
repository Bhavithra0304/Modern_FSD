<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Patient Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="register-body">
    <div class="container py-5">
      <div class="register-container">
        <div class="register-header">
          <i class="bi bi-heart-pulse-fill"></i>

          <h2>Patient Registration</h2>

          <p>
            Create your HealthNest account to access appointments, medical
            reports and healthcare services.
          </p>
        </div>

        <form>
          <h5 class="section-title">
            <i class="bi bi-person-fill"></i>

            Personal Information
          </h5>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-person"></i>
                </span>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Full Name"
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-envelope-fill"></i>
                </span>

                <input
                  type="email"
                  class="form-control"
                  placeholder="Email Address"
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-telephone-fill"></i>
                </span>

                <input
                  type="number"
                  class="form-control"
                  placeholder="Phone Number"
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-calendar-event-fill"></i>
                </span>

                <input type="date" class="form-control" />
              </div>
            </div>

            <div class="col-md-6">
              <select class="form-select">
                <option>Select Gender</option>

                <option>Male</option>

                <option>Female</option>

                <option>Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-droplet-fill"></i>
                </span>

                <input class="form-control" placeholder="Blood Group" />
              </div>
            </div>
          </div>

          <h5 class="section-title mt-4">
            <i class="bi bi-hospital-fill"></i>

            Medical Information
          </h5>

          <div class="row">
            <div class="col-md-6">
              <input
                class="form-control mb-3"
                placeholder="Existing Medical Conditions"
              />
            </div>

            <div class="col-md-6">
              <input class="form-control mb-3" placeholder="Allergies" />
            </div>
          </div>

          <h5 class="section-title mt-4">
            <i class="bi bi-shield-lock-fill"></i>

            Security Details
          </h5>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-lock-fill"></i>
                </span>

                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-lock-fill"></i>
                </span>

                <input
                  type="password"
                  class="form-control"
                  placeholder="Confirm Password"
                />
              </div>
            </div>
          </div>

          <h5 class="section-title mt-4">
            <i class="bi bi-person-lines-fill"></i>

            Emergency Contact
          </h5>

          <div class="row">
            <div class="col-md-6">
              <input
                class="form-control mb-3"
                placeholder="Emergency Contact Name"
              />
            </div>

            <div class="col-md-6">
              <input
                class="form-control mb-3"
                placeholder="Emergency Phone Number"
              />
            </div>
          </div>

          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" />

            <label> I agree to hospital policies and privacy terms. </label>
          </div>

          <button class="btn btn-primary register-btn">Create Account</button>

          <p class="text-center mt-4">
            Already registered?

            <a href="login.html"> Login </a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
