<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthNest | Contact</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a href="index.html" class="logo">
          <img src="image.png" alt="HealthNest Logo" />
        </a>
        <nav class="nav-menu">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a class="active" href="contact.html">Contact</a>
          <a href="faq.html">FAQ</a>
          <a href="register.html" class="btn btn-outline">Register</a>
          <a href="login.html" class="btn btn-primary">Login</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h2>Contact Us</h2>
        <div class="grid-2">
          <div class="info-card">
            <h3>Contact Details</h3>
            <p><strong>Email:</strong> support@carelink.com</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Address:</strong> Chennai, Tamil Nadu, India</p>
            <p class="small-text">We usually respond within 24 hours.</p>
          </div>

          <div class="form-card">
            <h3>Send Message</h3>
            <form action="#" method="post">
              <div class="form-group">
                <label for="contactName">Name</label>
                <input id="contactName" name="name" type="text" required />
              </div>
              <div class="form-group">
                <label for="contactEmail">Email</label>
                <input id="contactEmail" name="email" type="email" required />
              </div>
              <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
